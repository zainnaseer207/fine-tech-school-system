{% extends "base.html" %}
{% block content %}
<h2 style="margin-bottom:20px; color:#14213d;">➕ Add Fee Record</h2>

<div class="card" style="max-width:500px; margin:auto;">
  <form method="post">
    {% csrf_token %}
    
    <label>Student</label>
    <select name="student" required
            style="width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:6px;">
      {% for s in students %}
        <option value="{{ s.id }}">{{ s.name }} ({{ s.class_name }})</option>
      {% endfor %}
    </select>
    
    <label>Amount</label>
    <input type="number" name="amount" step="0.01" required
           style="width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:6px;">
    
    <label>Status</label>
    <select name="status" required
            style="width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:6px;">
      <option value="Paid">Paid</option>
      <option value="Pending">Pending</option>
    </select>
    
    <button type="submit"
            style="background:#14213d; color:white; padding:10px 20px; border:none; border-radius:6px; cursor:pointer; margin-top:10px;">
      💾 Save Fee Record
    </button>
  </form>
</div>
{% endblock %}
