{% extends "base.html" %}
{% block content %}
<h2>📢 Notices</h2>
<a href="{% url 'add_notice' %}" class="btn-link">➕ Add Notice</a>
<div class="card" style="margin-top:15px;">
  <ul style="list-style:none; padding:0;">
    {% for n in notices %}
      <li style="padding:10px; border-bottom:1px solid #eee;">
        <strong>{{ n.title }}</strong> ({{ n.date }}) <br>
        {{ n.description }} <br>
        <a href="{% url 'delete_notice' n.id %}" style="color:red;">🗑 Delete</a>
      </li>
    {% empty %}
      <li>No notices yet</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
