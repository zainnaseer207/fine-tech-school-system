<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Fine Tech School System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", sans-serif; }

    body {
      height: 100vh;
      background: url("{% static 'school.jpeg' %}") no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .signup-box {
      background: rgba(255, 255, 255, 0.85);
      padding: 40px 30px;
      border-radius: 16px;
      width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      backdrop-filter: blur(5px);
    }

    .signup-box img { width: 80px; margin-bottom: 15px; }

    .signup-box h2 { margin-bottom: 20px; color: #14213d; font-weight: bold; }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: 0.3s;
    }
    input:focus {
      border-color: #fca311;
      outline: none;
      box-shadow: 0 0 6px rgba(252,163,17,0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      background: #14213d;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #0d1626; }

    .error { color: #d64545; margin-bottom: 10px; font-size: 14px; }
    .success { color: #2a9d5f; margin-bottom: 10px; font-size: 14px; }

    .login-link { text-align: center; margin-top: 15px; font-size: 14px; }
    .login-link a { color: #14213d; font-weight: bold; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="signup-box">
    <img src="{% static 'logo.png' %}" alt="Fine Tech Logo">
    <h2>Create Account</h2>

    {% if messages %}
      {% for message in messages %}
        <p class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">{{ message }}</p>
      {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'signup' %}">
      {% csrf_token %}
      <input type="text" name="username" placeholder="Username" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>
      <button type="submit">Sign Up</button>
    </form>

    <div class="login-link">
      <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </div>
  </div>
</body>
</html>
