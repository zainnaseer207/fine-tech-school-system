{% extends "base.html" %}
{% block content %}
<h2>Add Student</h2>
<form method="post">
    {% csrf_token %}
    <label>Name:</label>
    <input type="text" name="name" required><br><br>

    <label for="father_name">Father Name:</label><br>
    <input type="text" name="father_name" id="father_name" required><br><br>

    <label>Roll No:</label>
    <input type="text" name="roll_no" required><br><br>

    <label>Class:</label>
    <input type="text" name="class_name" required><br><br>

    <label>Email:</label>
    <input type="email" name="email" required><br><br>

    <button type="submit">Save</button>
</form>
{% endblock %}
