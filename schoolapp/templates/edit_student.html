{% extends "base.html" %}
{% block content %}
<h2>Edit Student</h2>
<form method="post">
    {% csrf_token %}
    <label>Name:</label>
    <input type="text" name="name" value="{{ student.name }}" required><br><br>

    <label for="father_name">Father Name:</label><br>
    <input type="text" name="father_name" id="father_name" value="{{ student.father_name }}" required><br><br>

    <label>Roll No:</label>
    <input type="text" name="roll_no" value="{{ student.roll_no }}" required><br><br>

    <label>Class:</label>
    <input type="text" name="class_name" value="{{ student.class_name }}" required><br><br>

    <label>Email:</label>
    <input type="email" name="email" value="{{ student.email }}" required><br><br>

    <button type="submit">Update</button>
</form>
{% endblock %}
