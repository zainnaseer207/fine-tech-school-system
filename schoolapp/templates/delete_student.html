{% extends "base.html" %}
{% block content %}
<h2>Delete Student</h2>
<p>Are you sure you want to delete <strong>{{ student.name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'students' %}">Cancel</a>
</form>
{% endblock %}
