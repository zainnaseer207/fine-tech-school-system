{% extends "base.html" %}
{% block content %}
<h2>✏️ Edit Fund</h2>
<form method="post">
  {% csrf_token %}
  <input type="text" name="title" value="{{ fund.title }}" required><br><br>
  <input type="number" step="0.01" name="amount" value="{{ fund.amount }}" required><br><br>
  <select name="fund_type">
    <option value="Income" {% if fund.fund_type == "Income" %}selected{% endif %}>Income</option>
    <option value="Expenditure" {% if fund.fund_type == "Expenditure" %}selected{% endif %}>Expenditure</option>
  </select><br><br>
  <textarea name="description">{{ fund.description }}</textarea><br><br>
  <button type="submit">Update</button>
</form>
{% endblock %}
