{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2 class="text-danger">Delete Staff</h2>
    <p>Are you sure you want to delete <strong>{{ staff.name }}</strong> (Position: {{ staff.position }})?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'staff' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
